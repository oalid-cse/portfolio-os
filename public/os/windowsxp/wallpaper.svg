<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- "Meadow morning": an original landscape for this portfolio. Two crossing meadows meet in a
       shallow valley right of centre, under a far blue-green ridge and a high, soft-clouded sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5fcf"/>
      <stop offset="0.35" stop-color="#3e86e6"/>
      <stop offset="0.62" stop-color="#7fb7f1"/>
      <stop offset="0.75" stop-color="#b9daf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fff9df" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff9df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9fae"/>
      <stop offset="1" stop-color="#7fb9a8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fcf4e"/>
      <stop offset="0.5" stop-color="#4fa22e"/>
      <stop offset="1" stop-color="#2d7a1f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9ad84f"/>
      <stop offset="0.35" stop-color="#5eb02f"/>
      <stop offset="1" stop-color="#2a6e17"/>
    </linearGradient>
    <linearGradient id="near" x1="1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7cc63c"/>
      <stop offset="0.5" stop-color="#3f8f22"/>
      <stop offset="1" stop-color="#215c12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="haze" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Clouds: wide, low-contrast drifts, heavier on the left and high on the right -->
  <g fill="#ffffff" filter="url(#soft)">
    <g opacity="0.85">
      <ellipse cx="260" cy="210" rx="190" ry="44"/>
      <ellipse cx="380" cy="180" rx="120" ry="50"/>
      <ellipse cx="170" cy="238" rx="130" ry="30"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1180" cy="120" rx="170" ry="30"/>
      <ellipse cx="1290" cy="100" rx="90" ry="34"/>
    </g>
    <g opacity="0.55">
      <ellipse cx="760" cy="330" rx="230" ry="26"/>
      <ellipse cx="860" cy="312" rx="110" ry="28"/>
      <ellipse cx="1450" cy="380" rx="150" ry="22"/>
    </g>
    <ellipse cx="600" cy="90" rx="140" ry="18" opacity="0.4"/>
  </g>

  <!-- Far ridge, hazed into the sky -->
  <path d="M-60 650 L0 640 C 180 600 320 590 470 612 S 760 640 900 600 S 1180 560 1340 590 S 1520 620 1660 600 L1660 760 L-60 760 Z" fill="url(#ridge)" filter="url(#haze)" opacity="0.9"/>

  <!-- Back meadow rising to the right -->
  <path d="M0 760 C 260 720 520 700 760 690 C 1000 680 1220 640 1400 610 C 1490 596 1560 600 1600 606 L1600 1000 L0 1000 Z" fill="url(#back)"/>

  <!-- Front meadow: a broad swell from the left that falls into the valley -->
  <path d="M0 700 C 140 650 330 640 520 680 C 700 718 860 800 1020 860 C 1120 896 1200 930 1260 1000 L0 1000 Z" fill="url(#front)"/>

  <!-- Near slope in the bottom-right corner -->
  <path d="M960 1000 C 1080 920 1240 860 1420 850 C 1500 846 1560 852 1600 862 L1600 1000 Z" fill="url(#near)"/>

  <!-- Sunlit crests and a few grassy streaks -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 690 C 200 648 360 646 520 684" stroke="#d6f59a" stroke-width="5" opacity="0.55" filter="url(#haze)"/>
    <path d="M820 694 C 1020 680 1220 640 1400 612" stroke="#d9f6a6" stroke-width="4" opacity="0.4" filter="url(#haze)"/>
    <path d="M1080 920 C 1220 868 1360 852 1560 856" stroke="#c4ee84" stroke-width="4" opacity="0.45" filter="url(#haze)"/>
  </g>
</svg>
