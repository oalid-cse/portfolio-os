<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork for this portfolio ("Dusk strata"): layered gradient waves. Not derived from any OS wallpaper. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1030"/>
      <stop offset="0.45" stop-color="#2a1b5c"/>
      <stop offset="0.75" stop-color="#7a2f6e"/>
      <stop offset="1" stop-color="#d0645f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffc98a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#f08a5d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f08a5d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#5b3a9e"/>
      <stop offset="0.6" stop-color="#e0857a"/>
      <stop offset="1" stop-color="#ffcf9a"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3d2580"/>
      <stop offset="0.55" stop-color="#b14d84"/>
      <stop offset="1" stop-color="#f29a6c"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0.2" x2="1" y2="0">
      <stop offset="0" stop-color="#28196a"/>
      <stop offset="0.5" stop-color="#7c3487"/>
      <stop offset="1" stop-color="#d0607a"/>
    </linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#1a1150"/>
      <stop offset="0.6" stop-color="#4a2276"/>
      <stop offset="1" stop-color="#93407f"/>
    </linearGradient>
    <linearGradient id="w5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#100b38"/>
      <stop offset="0.55" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#55246f"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffe2c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <path fill="url(#w1)" opacity="0.9" d="M0 520 C 320 430 560 600 900 540 S 1500 380 1920 470 V 1080 H 0 Z"/>
  <path fill="url(#w2)" d="M0 610 C 260 540 520 700 860 650 S 1460 500 1920 590 V 1080 H 0 Z"/>
  <path fill="none" stroke="url(#crest)" stroke-width="3" filter="url(#soft)" d="M0 610 C 260 540 520 700 860 650 S 1460 500 1920 590"/>
  <path fill="url(#w3)" d="M0 720 C 300 640 640 800 980 740 S 1560 630 1920 700 V 1080 H 0 Z"/>
  <path fill="none" stroke="url(#crest)" stroke-width="2" opacity="0.7" filter="url(#soft)" d="M0 720 C 300 640 640 800 980 740 S 1560 630 1920 700"/>
  <path fill="url(#w4)" d="M0 830 C 360 760 700 900 1060 840 S 1620 760 1920 810 V 1080 H 0 Z"/>
  <path fill="url(#w5)" d="M0 940 C 380 880 760 990 1120 940 S 1660 880 1920 920 V 1080 H 0 Z"/>
</svg>
