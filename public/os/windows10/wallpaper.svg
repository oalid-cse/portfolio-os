<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork for this portfolio ("Slate prisms"). Not derived from any OS wallpaper. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a1c"/>
      <stop offset="0.55" stop-color="#062457"/>
      <stop offset="1" stop-color="#03112e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3fa6ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0b5cc4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b5cc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3f94" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#1468d6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5fb6ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0c4aa6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f57bd" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#051c46" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#cfe9ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Large facets rising to the upper right -->
  <polygon points="420,1080 1310,180 1560,300 900,1080" fill="url(#p1)" opacity="0.55"/>
  <polygon points="980,1080 1520,330 1920,520 1920,1080" fill="url(#p3)" opacity="0.7"/>
  <polygon points="1310,180 1560,300 1920,140 1920,0 1520,0" fill="url(#p2)" opacity="0.6"/>
  <polygon points="0,760 760,420 1310,180 980,520 0,1000" fill="url(#p3)" opacity="0.45"/>
  <polygon points="1100,620 1520,330 1660,420 1280,760" fill="url(#p2)" opacity="0.35"/>
  <!-- Lit edges -->
  <g filter="url(#soft)">
    <path d="M420 1080 L1310 180" stroke="url(#edge)" stroke-width="5" fill="none"/>
    <path d="M980 1080 L1520 330" stroke="url(#edge)" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  <path d="M420 1080 L1310 180" stroke="url(#edge)" stroke-width="1.5" fill="none"/>
  <path d="M980 1080 L1520 330 L1920 520" stroke="url(#edge)" stroke-width="1" fill="none" opacity="0.8"/>
  <path d="M1310 180 L1560 300" stroke="#bfe2ff" stroke-opacity="0.5" stroke-width="1" fill="none"/>
</svg>
