<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork for this portfolio ("Tide glass"): soft overlapping light pools on deep water. Not derived from any OS wallpaper. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#050b1f"/>
      <stop offset="0.5" stop-color="#0a2340"/>
      <stop offset="1" stop-color="#06343c"/>
    </linearGradient>
    <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cf2c7" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#1fb39a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1fb39a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a76" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#f2557a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f2557a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a99bff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#5a4bd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a4bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1170" height="2532" fill="url(#sea)"/>
  <g filter="url(#soft)">
    <ellipse cx="930" cy="520" rx="620" ry="560" fill="url(#lilac)"/>
    <ellipse cx="180" cy="1180" rx="700" ry="640" fill="url(#mint)"/>
    <ellipse cx="900" cy="1780" rx="680" ry="620" fill="url(#coral)"/>
    <ellipse cx="300" cy="2380" rx="560" ry="420" fill="url(#lilac)" opacity="0.7"/>
  </g>
  <g fill="none" stroke="url(#ribbon)" stroke-width="3">
    <path d="M-40 980 C 260 860, 520 1120, 820 1000 S 1160 860, 1240 940"/>
    <path d="M-40 1040 C 260 920, 520 1180, 820 1060 S 1160 920, 1240 1000" opacity="0.7"/>
    <path d="M-40 1100 C 260 980, 520 1240, 820 1120 S 1160 980, 1240 1060" opacity="0.45"/>
  </g>
</svg>
