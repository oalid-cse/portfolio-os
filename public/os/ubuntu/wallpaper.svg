<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original abstract artwork for this portfolio ("Ember fold"): folded silk ribbons rising from the lower left over a deep aubergine field. Not derived from any Ubuntu wallpaper or logo. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0614"/>
      <stop offset="0.55" stop-color="#2e0a26"/>
      <stop offset="1" stop-color="#4a0f33"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.3" cy="0.92" r="0.75">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#c2305a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c2305a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a24a"/>
      <stop offset="0.35" stop-color="#e95420"/>
      <stop offset="0.75" stop-color="#a8235a"/>
      <stop offset="1" stop-color="#4b1240" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r1edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd59a"/>
      <stop offset="0.5" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#ff9a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="1" x2="1" y2="0.2">
      <stop offset="0" stop-color="#b8285c"/>
      <stop offset="0.5" stop-color="#77216f"/>
      <stop offset="1" stop-color="#3a0c34" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#f06b2c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f06b2c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#field)"/>
  <rect width="1920" height="1080" fill="url(#ember)"/>

  <!-- back ribbon: plum, wide and slow -->
  <path d="M-80 1080 C 240 860, 520 820, 860 640 S 1420 260, 2000 140 L 2000 360 C 1500 420, 1180 640, 900 800 S 380 1040, 120 1160 Z"
        fill="url(#r2)" opacity="0.85"/>

  <!-- haze under the main fold -->
  <path d="M-40 1080 C 300 900, 640 860, 980 640 S 1500 300, 1960 220 L 1960 300 C 1500 380, 1140 660, 860 840 S 300 1080, 0 1140 Z"
        fill="#ff6a2a" opacity="0.35" filter="url(#haze)"/>

  <!-- main ribbon: orange to magenta, folding over itself -->
  <path d="M-60 1000 C 260 900, 560 880, 880 700 C 1140 552, 1340 380, 1980 260 L 1980 330 C 1420 430, 1220 600, 960 760 C 640 960, 320 1040, -60 1110 Z"
        fill="url(#r1)"/>
  <path d="M-60 1000 C 260 900, 560 880, 880 700 C 1140 552, 1340 380, 1980 260"
        fill="none" stroke="url(#r1edge)" stroke-width="3" opacity="0.9" filter="url(#soft)"/>

  <!-- the fold: underside of the ribbon turning back -->
  <path d="M880 700 C 1000 640, 1080 600, 1160 548 C 1110 640, 1040 700, 960 760 Z"
        fill="url(#shade)"/>

  <!-- front ribbon: thin bright strand -->
  <path d="M-60 1080 C 300 1000, 620 1010, 940 860 S 1480 520, 1980 470 L 1980 500 C 1500 548, 1220 760, 960 900 S 320 1060, -60 1110 Z"
        fill="url(#r3)"/>

  <!-- fine silk threads -->
  <g fill="none" stroke="#ffd2a8" stroke-linecap="round" opacity="0.18">
    <path d="M-40 960 C 300 860, 600 840, 900 670 S 1440 320, 1980 220" stroke-width="1.2"/>
    <path d="M-40 1040 C 320 950, 620 950, 930 780 S 1460 430, 1980 380" stroke-width="1"/>
    <path d="M-40 1070 C 340 990, 640 1000, 950 840 S 1470 500, 1980 450" stroke-width="0.8"/>
  </g>
</svg>
