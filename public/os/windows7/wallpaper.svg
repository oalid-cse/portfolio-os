    <circle cx="1652" cy="834" r="39" fill="url(#bokeh)" opacity="0.55"/>
    <circle cx="856" cy="410" r="27" fill="url(#bokeh)" opacity="0.56"/>
    <circle cx="407" cy="242" r="58" fill="url(#bokeh)" opacity="0.33"/>
    <circle cx="974" cy="622" r="25" fill="url(#bokeh)" opacity="0.34"/>
    <circle cx="862" cy="420" r="14" fill="url(#bokeh)" opacity="0.45"/>
