    <polygon points="1180,560 1898,-757 2001,-695" fill="url(#ray)" opacity="0.12"/>
    <polygon points="1180,560 2345,-385 2402,-309" fill="url(#ray)" opacity="0.13"/>
    <polygon points="1180,560 2520,-113 2566,-14" fill="url(#ray)" opacity="0.11"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M-80 900 C 420 760, 820 520, 1180 560 S 1760 300, 2040 180" stroke="url(#swoosh)" stroke-width="34" filter="url(#haze)"/>
    <path d="M-80 900 C 420 760, 820 520, 1180 560 S 1760 300, 2040 180" stroke="url(#swoosh)" stroke-width="3"/>
    <path d="M-60 1010 C 500 860, 900 660, 1180 560 S 1820 420, 2000 360" stroke="url(#swoosh2)" stroke-width="22" filter="url(#haze)"/>
    <path d="M-60 1010 C 500 860, 900 660, 1180 560 S 1820 420, 2000 360" stroke="url(#swoosh2)" stroke-width="2"/>
  </g>
  <circle cx="1180" cy="560" r="620" fill="url(#burst)"/>
  <g>
