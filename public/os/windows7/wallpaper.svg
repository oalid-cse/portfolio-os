    <polygon points="1180,560 -319,503 -313,419" fill="url(#ray)" opacity="0.10"/>
    <polygon points="1180,560 -232,55 -194,-42" fill="url(#ray)" opacity="0.09"/>
    <polygon points="1180,560 -72,-265 -32,-324" fill="url(#ray)" opacity="0.07"/>
    <polygon points="1180,560 431,-740 529,-791" fill="url(#ray)" opacity="0.08"/>
    <polygon points="1180,560 890,-912 1002,-929" fill="url(#ray)" opacity="0.07"/>
