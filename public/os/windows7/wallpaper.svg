<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- "Glass dawn": original abstract light-burst on blue, made for this portfolio. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04214d"/>
      <stop offset="0.45" stop-color="#0b4f9c"/>
      <stop offset="0.75" stop-color="#1373c6"/>
      <stop offset="1" stop-color="#083a7a"/>
    </linearGradient>
    <radialGradient id="burst" cx="1180" cy="560" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.08" stop-color="#d9f3ff" stop-opacity="0.8"/>
      <stop offset="0.3" stop-color="#5cc4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e7fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ray" cx="1180" cy="560" r="1400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#bfe8ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#bfe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh">
      <stop offset="0" stop-color="#cfefff" stop-opacity="0.35"/>
      <stop offset="0.8" stop-color="#9fdcff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#9ff0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swoosh2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf0b4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ff5c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cf0b4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <polygon points="1180,560 2677,464 2680,545" fill="url(#ray)" opacity="0.10"/>
    <polygon points="1180,560 2644,886 2613,1003" fill="url(#ray)" opacity="0.08"/>
    <polygon points="1180,560 2446,1364 2379,1462" fill="url(#ray)" opacity="0.05"/>
    <polygon points="1180,560 1979,1829 1917,1867" fill="url(#ray)" opacity="0.06"/>
    <polygon points="1180,560 1538,2017 1389,2045" fill="url(#ray)" opacity="0.06"/>
    <polygon points="1180,560 1071,2056 941,2041" fill="url(#ray)" opacity="0.13"/>
    <polygon points="1180,560 455,1873 364,1818" fill="url(#ray)" opacity="0.13"/>
    <polygon points="1180,560 184,1682 74,1573" fill="url(#ray)" opacity="0.07"/>
